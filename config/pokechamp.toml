# pokechamp 설정. 사용자가 정할 튜닝 값은 여기에 둔다 (CLAUDE.md "평가와 재현성").

[stats]
# 처음 실행할 때 받아 올 일별 스냅샷 수 (출처가 주는 최대 31일)
backfill_days = 7
# 최신 데이터가 이 일수보다 오래되면 경고한다
max_age_days = 2
# 출처가 붙인 시즌 표기와 공식 시즌(데이터 날짜 기준)이 다를 때:
#   "date"   = 날짜 기준 공식 시즌을 쓰고 저장한다 (표기 불일치는 스냅샷 메모와 status에 남긴다)
#   "strict" = 저장하지 않는다
season_label_policy = "date"
# 같은 출처에 대한 요청 간격(초)과 응답 캐시 시간(시간)
request_interval_s = 0.5
cache_hours = 6
# 출처 하나의 전체 수집 시간 상한(초). 넘으면 그때까지 받은 것만 저장한다
source_timeout_s = 600

[stats.sources.championsbattledata]
enabled = true
format = "Singles"

[priors]
# 스냅샷 가중치의 반감기(일). 데이터 날짜 기준 경과 시간으로 지수 감쇠한다 (스냅샷 개수 기준 아님)
half_life_days = 3.0
# 최신 스냅샷이 이 일수보다 오래되면 모든 추천에 "통계가 N일 전 기준" 경고를 붙인다
stale_after_days = 2
# 추세: 최신 스냅샷과 이 일수 이상 앞선 스냅샷을 비교한다. 이 범위 안에 비교 대상이 없으면 추세는 "알 수 없음"
trend_min_gap_days = 3
trend_max_gap_days = 14
# 현재 레귤레이션 자료가 없을 때 이전 레귤레이션 자료에 줄 가중치 배율
previous_regulation_weight = 0.2
# 출처는 사용률(%) 대신 순위만 준다. 포켓몬 출현 가중치를 순위로 추정: w ∝ 1 / 순위^지수
rank_weight_exponent = 1.0

[sets]
# 세트 원형 만들기 (PROJECT_PLAN 4.7)
# 포켓몬마다 주변 분포에서 뽑아 볼 후보 세트 수 (규칙 필터를 통과한 것만 원형이 된다)
samples_per_species = 3000
# 한 포켓몬에 남길 원형 최대 개수 (가중치 상위)
max_archetypes = 80
# IPF(반복 비례 맞춤) 반복 횟수: 원형 가중치를 최신 기술·도구 채용률에 맞춘다
ipf_iterations = 30
# 믿음 상태에서 규칙으로 만든 원형에 곱할 사전 가중치 (완성 세트 원형과 섞일 때)
rule_generated_weight = 0.5
# 결정적 결과를 위한 시드
seed = 20261119

[teambuild]
# 파티 추천 (PROJECT_PLAN 7절). Score = E[V] − α(E[V] − CVaR[V]) − β·SD_시나리오
alpha = 0.5
beta = 0.5
# CVaR 하위 비율
cvar_fraction = 0.1
# 위협(상대 메타): 출현 가중치 상위 몇 마리, 포켓몬마다 원형 몇 개
threat_species = 60
threat_archetypes = 3
# 내 후보: 포켓몬마다 원형 몇 개 (국소 탐색이 도구·기술을 더 바꿔 본다)
candidate_archetypes = 2
# 점수 계산에 쓰는 상대 팀 수 (메타에서 합성, 같은 팀을 시나리오별로 다시 가중한다)
opponent_teams = 64
# 상대 팀 합성 때 동료 통계를 반영하는 세기 (0이면 출현 가중치만)
teammate_strength = 3.0
# 메타 시나리오 (b): 상위 포켓몬 비중을 올린 분포 w^지수, (c): 추세 반영 세기 (추세를 모르면 건너뜀)
scenario_top_exponent = 1.5
scenario_trend_strength = 0.5
# 3:3 선출 값 = 이 비율 × (1:1 짝짓기 최선값) + 나머지 × (9쌍 평균)
assignment_weight = 0.6
# 팀 안 메가 후보(메가스톤 소지자) 최대 수
max_mega = 2
# 빔 서치 폭, 단계마다 정밀 평가할 후보 수, 국소 탐색 반복 수
beam_width = 6
prefilter = 24
local_search_rounds = 2
# 균형 근사 반복 수 (탐색 중), 최종 출력은 선형계획으로 정확히 푼다
nash_iterations = 300
seed = 20261119

[select]
# 선출 추천 (PROJECT_PLAN 8절). 팀 프리뷰에서 추천이 나올 때까지의 시간 상한(초). 근사 행렬 계산을 포함한다
time_budget_s = 20
# 내 선출 3마리 중 메가스톤 소지자 최대 수 (사용자 운용 규칙, 5.1절)
max_mega_in_pick = 1
# 상대 세트 샘플 수: 상대 6마리의 세트를 원형 분포(결합 분포)에서 이만큼 뽑아 근사 행렬을 평균하고,
# 정밀 칸 하나의 샘플 상한으로도 쓴다
opponent_samples = 32
# 정밀 칸을 처음 계산할 때와 정밀화할 때마다 더하는 샘플 수 (샘플 하나 = 3:3 시뮬레이션 한 판)
precise_samples = 16
# 근사 3:3 값 = (1 − 이 비율) × 선출 게임 값(teambuild.assignment_weight 사용) + 이 비율 × 선봉끼리 1:1 값
lead_weight = 0.2
# 더블 오라클: 처음 후보 선출 수(양쪽 각각), 한 번에 더할 최선 응수 수, 응수가 균형보다 이만큼 나아야 더한다
# (정밀 칸이 칸당 16판이라 잡음이 크다. 0.01이면 예시 팀에서 수렴까지 40초, 0.02면 25초였고 답은 같았다)
# (정밀 칸이 칸당 16판이라 잡음이 크다. 예시 팀에서 0.01이면 수렴까지 40초, 0.02면 25초였고 답은 같았다)
initial_candidates = 4
add_per_iteration = 2
oracle_epsilon = 0.02
# 탐색 확인: 근사로 더 나은 응수가 없을 때 근사 순위 상위의 미탐색 선출을 양쪽 이만큼 정밀 계산해 본다.
# 넣은 선출이 균형에 안 들어오는 일이 probe_rounds번 이어지면 수렴으로 본다
probe_candidates = 4
probe_rounds = 2
# 최종 균형: "rows_all" = 정밀 계산한 내 선출 × 상대 선출 전체(후보 밖은 보정 근사값), "candidates" = 후보 행 × 후보 열.
# 작은 사례 두 개(전체 정밀 행렬과 홀드아웃 행렬로 비교, 3,000판 예산)에서 상대 최선 응수 기준 값이
# rows_all 0.548·0.687, candidates 0.548·0.605였다 (docs/VERIFIED.md)
final_solve = "rows_all"
# 상대 모델: 최종 전략 = (1 − 이 비율) × 균형 해 + 이 비율 × 상대 모델에 대한 최선 응수 (8절 5번)
opponent_model_mix = 0.3
# 상대 모델 분포 ∝ Π(포켓몬 출현 가중치^지수) × exp(온도 × 상대 입장 근사 승률)
opponent_model_temperature = 5.0
opponent_usage_exponent = 1.0
# 엔진 처리량 첫 추정치(판/초). 실행 중 실제 처리량으로 바꿔 가며 예산 안에 들어갈 판 수를 정한다
games_per_second_estimate = 150
# 출력에서 생략할 작은 선택 확률
show_min_probability = 0.005
seed = 20261119
