# pokechamp 설정. 사용자가 정할 튜닝 값은 여기에 둔다 (CLAUDE.md "평가와 재현성").

[stats]
# 처음 실행할 때 받아 올 일별 스냅샷 수 (출처가 주는 최대 31일)
backfill_days = 7
# 최신 데이터가 이 일수보다 오래되면 경고한다
max_age_days = 2
# 출처가 붙인 시즌 표기와 공식 시즌(데이터 날짜 기준)이 다를 때:
#   "date"   = 날짜 기준 공식 시즌을 쓰고 저장한다 (표기 불일치는 스냅샷 메모와 status에 남긴다)
#   "strict" = 저장하지 않는다
season_label_policy = "date"
# 같은 출처에 대한 요청 간격(초)과 응답 캐시 시간(시간)
request_interval_s = 0.5
cache_hours = 6
# 출처 하나의 전체 수집 시간 상한(초). 넘으면 그때까지 받은 것만 저장한다
source_timeout_s = 600

[stats.sources.championsbattledata]
enabled = true
format = "Singles"

[priors]
# 스냅샷 가중치의 반감기(일). 데이터 날짜 기준 경과 시간으로 지수 감쇠한다 (스냅샷 개수 기준 아님)
half_life_days = 3.0
# 최신 스냅샷이 이 일수보다 오래되면 모든 추천에 "통계가 N일 전 기준" 경고를 붙인다
stale_after_days = 2
# 추세: 최신 스냅샷과 이 일수 이상 앞선 스냅샷을 비교한다. 이 범위 안에 비교 대상이 없으면 추세는 "알 수 없음"
trend_min_gap_days = 3
trend_max_gap_days = 14
# 현재 레귤레이션 자료가 없을 때 이전 레귤레이션 자료에 줄 가중치 배율
previous_regulation_weight = 0.2
# 출처는 사용률(%) 대신 순위만 준다. 포켓몬 출현 가중치를 순위로 추정: w ∝ 1 / 순위^지수
rank_weight_exponent = 1.0

[sets]
# 세트 원형 만들기 (PROJECT_PLAN 4.7)
# 포켓몬마다 주변 분포에서 뽑아 볼 후보 세트 수 (규칙 필터를 통과한 것만 원형이 된다)
samples_per_species = 3000
# 한 포켓몬에 남길 원형 최대 개수 (가중치 상위)
max_archetypes = 80
# IPF(반복 비례 맞춤) 반복 횟수: 원형 가중치를 최신 기술·도구 채용률에 맞춘다
ipf_iterations = 30
# 믿음 상태에서 규칙으로 만든 원형에 곱할 사전 가중치 (완성 세트 원형과 섞일 때)
rule_generated_weight = 0.5
# 결정적 결과를 위한 시드
seed = 20261119

[teambuild]
# 파티 추천 (PROJECT_PLAN 7절). Score = E[V] − α(E[V] − CVaR[V]) − β·SD_시나리오
alpha = 0.5
beta = 0.5
# CVaR 하위 비율
cvar_fraction = 0.1
# 위협(상대 메타): 출현 가중치 상위 몇 마리, 포켓몬마다 원형 몇 개
threat_species = 60
threat_archetypes = 3
# 내 후보: 포켓몬마다 원형 몇 개 (국소 탐색이 도구·기술을 더 바꿔 본다)
candidate_archetypes = 2
# 점수 계산에 쓰는 상대 팀 수 (메타에서 합성, 같은 팀을 시나리오별로 다시 가중한다)
opponent_teams = 64
# 상대 팀 합성 때 동료 통계를 반영하는 세기 (0이면 출현 가중치만)
teammate_strength = 3.0
# 메타 시나리오 (b): 상위 포켓몬 비중을 올린 분포 w^지수, (c): 추세 반영 세기 (추세를 모르면 건너뜀)
scenario_top_exponent = 1.5
scenario_trend_strength = 0.5
# 3:3 선출 값 = 이 비율 × (1:1 짝짓기 최선값) + 나머지 × (9쌍 평균)
assignment_weight = 0.6
# 팀 안 메가 후보(메가스톤 소지자) 최대 수
max_mega = 2
# 빔 서치 폭, 단계마다 정밀 평가할 후보 수, 국소 탐색 반복 수
beam_width = 6
prefilter = 24
local_search_rounds = 2
# 균형 근사 반복 수 (탐색 중), 최종 출력은 선형계획으로 정확히 푼다
nash_iterations = 300
seed = 20261119
